services:
  db:
    image: postgres:15
    container_name: cuestionarios_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    # Sin "ports": la base solo es alcanzable dentro de la red interna
    # de docker compose (servicio "db"), nunca desde fuera del host.

  app:
    image: ghcr.io/eduardomortensen/cuestionarios-adulto-mayor:${APP_TAG:-latest}
    container_name: cuestionarios_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Solo loopback: la app no queda expuesta a internet directamente,
      # cloudflared (en el host o como contenedor en esta red) apunta acá.
      - '127.0.0.1:${PORT:-3000}:${PORT:-3000}'

volumes:
  postgres_data:
